interface=eth1
# IPv4 DHCP
dhcp-range=192.168.0.50,192.168.0.100,255.255.255.0,12h
dhcp-option=1,255.255.255.0
dhcp-option=3,192.168.0.100
dhcp-option=6,192.168.0.100
# IPv6 RA + DHCPv6
enable-ra
dhcp-range=::50,::ff,constructor:eth1,12h
ra-param=eth1,10,200
bind-interfaces
no-resolv
log-dhcp
log-queries